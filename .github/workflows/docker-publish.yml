name: Build & publish images

# Builds the backend (api/worker) and frontend images once on GitHub's runners
# and pushes them to the GitHub Container Registry (GHCR). Users then PULL these
# instead of building locally — turning install from a long build into a quick
# `docker compose pull`.
#
# Triggers: a release tag (v1.2.3) or a manual run from the Actions tab.
# After the first run, make the two GHCR packages PUBLIC (GitHub → your profile →
# Packages → each package → Package settings → Change visibility → Public) so
# anyone can pull without authenticating.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  OWNER: samratrajsharma

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            context: .
            dockerfile: infrastructure/Dockerfile
          - name: frontend
            context: frontend/Frontend
            dockerfile: frontend/Frontend/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/data-handler-${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=ref,event=tag
            type=sha,format=short

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
