name: Smoke test

# Answers the question "does a clean install actually work?" automatically, on
# every push — instead of finding out when a user reports it.
#
# It reproduces the new-user path: fresh checkout, .env from the example, bring
# the whole stack up, and assert the app really responds. If this is green, the
# code on main starts. If it is red, it does not — regardless of what anyone
# believed while writing it.
#
# Deliberately NOT a gate on docker-publish.yml. A flaky infrastructure test
# should surface a problem, not block a release; the two workflows run
# independently and are read together.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  stack:
    name: Stack comes up from a clean checkout
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Runs before the stack because it needs neither Docker nor npm install:
      # Node 22.6+ strips TypeScript types on the fly, so this executes the real
      # maskCodec.ts rather than a compiled copy that could drift from it.
      # Guards the one failure mode that does not throw — the browser's mask
      # encoder and Python's decoder disagreeing, which silently stores masks
      # that decode to the wrong pixels.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Assert the mask codec matches across TypeScript and Python
        run: node --experimental-strip-types scripts/check_mask_codec_parity.mjs

      - name: Test the mask painting primitives
        run: node --experimental-strip-types scripts/check_mask_paint.mjs

      # The help sheet is data; the bindings are a switch statement. Nothing at
      # runtime makes them agree, and a sheet that promises a key the editor no
      # longer implements teaches users to distrust the whole list.
      - name: Assert every documented shortcut is implemented
        run: node scripts/check_shortcuts.mjs

      # The collapsed sidebar hid labels with opacity alone, so they still
      # reserved width and pushed every icon out of the 72px rail. The CSS
      # comment described the fix that was not there — which is why this is a
      # check and not a code review note.
      - name: Assert the collapsed sidebar still fits its icons
        run: node scripts/check_sidebar_rail.mjs

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # run.ps1 / run.sh create this for real users; the workflow does the same
      # thing explicitly so a missing .env fails loudly here rather than later.
      - name: Create .env from the example
        run: cp .env.example .env

      # Builds from THIS commit rather than pulling GHCR, so the test covers the
      # code being pushed instead of the last published image.
      - name: Build and start the stack
        run: |
          docker compose -f infrastructure/docker-compose.yml up -d --build
          echo "--- containers ---"
          docker compose -f infrastructure/docker-compose.yml ps

      - name: Wait for the API to report healthy
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8000/health | grep -q '"status":"healthy"'; then
              echo "API healthy after ~$((i*2))s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::API never became healthy within 180s"
          exit 1

      # Guards the specific regression that started all of this: a bind mount
      # shadowing the image meant the container could run code that was not in
      # the image it claims to be. /app must come from the image layer.
      - name: Assert the app runs from the image, not a mount
        run: |
          docker compose -f infrastructure/docker-compose.yml exec -T api test -f /app/app.py
          mounted=$(docker inspect datahandler-api \
            --format '{{range .Mounts}}{{.Destination}} {{end}}')
          echo "api mounts: $mounted"
          case "$mounted" in
            *"/app"*) echo "::error::/app is bind-mounted in the default compose file"; exit 1 ;;
          esac

      - name: Assert core endpoints respond
        run: |
          set -e
          curl -fsS http://localhost:8000/docs            > /dev/null && echo "  /docs OK"
          curl -fsS http://localhost:8000/api/v1/datasets > /dev/null && echo "  /api/v1/datasets OK"
          curl -fsS http://localhost:8000/api/v1/tasks    > /dev/null && echo "  /api/v1/tasks OK"
          curl -fsS http://localhost:8000/api/v1/version  > /dev/null && echo "  /api/v1/version OK"

      # Starlette matches routes in registration order, so a literal segment
      # declared after a path parameter is unreachable. /{dataset_id}/clusters
      # sat below /{dataset_id}/{asset_id} and returned 422 for its entire
      # existence — the clusters UI never worked. Pin the ordering:
      # a nonexistent dataset must give 404 (route matched, dataset missing),
      # never 422 (route did not match, "clusters" parsed as a UUID).
      - name: Assert literal routes are not shadowed by path params
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            http://localhost:8000/api/v1/images/00000000-0000-0000-0000-000000000000/clusters)
          echo "  /images/{id}/clusters -> $code"
          if [ "$code" = "422" ]; then
            echo "::error::/clusters is shadowed by /{asset_id} again - move it above that route"
            exit 1
          fi

      # The analytics endpoint is the only new route with aggregate SQL
      # (CASE bucketing, a grouped subquery, COUNT DISTINCT). None of that is
      # exercised by a type check, and a malformed expression fails at query
      # time, not import time — so it is called here against a real Postgres.
      # 404 proves the route matched and the dataset was missing; 422 would
      # mean "analytics" was parsed as a UUID by a shadowing route, and 500
      # means the SQL itself is broken.
      - name: Assert the analytics endpoint executes its SQL
        run: |
          code=$(curl -s -o /tmp/an.txt -w '%{http_code}' \
            http://localhost:8000/api/v1/annotations/00000000-0000-0000-0000-000000000000/images/analytics)
          echo "  /annotations/{id}/images/analytics -> $code"
          cat /tmp/an.txt
          case "$code" in
            404) echo "  route reachable" ;;
            422) echo "::error::analytics is shadowed by a path-param route"; exit 1 ;;
            5*)  echo "::error::analytics returned $code - the aggregate SQL is broken"; exit 1 ;;
          esac

      # The baseline migration is hand-written (no database was available to
      # autogenerate against), so it is verified rather than trusted: a clean
      # Postgres has just been built by Alembic, and this compares the result
      # with Base.metadata. Also catches any future migration that drifts from
      # the models — the exact failure this phase set out to remove.
      - name: Assert the migrated schema matches the models
        run: |
          docker compose -f infrastructure/docker-compose.yml exec -T api \
            python scripts/check_schema_drift.py

      # Alembic must be the sole schema owner. A fresh database should end up
      # stamped at head; an empty alembic_version would mean create_all built
      # the schema behind Alembic's back and migrations would never apply.
      - name: Assert Alembic is at head
        run: |
          out=$(docker compose -f infrastructure/docker-compose.yml exec -T api \
                  alembic current 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "head" || {
            echo "::error::alembic current does not report head - the database was not migrated"
            exit 1
          }

      # A crash-looping worker is invisible from the API side: the UI loads and
      # every background job queues forever. Ping it directly.
      - name: Assert the Celery worker answers
        run: |
          docker compose -f infrastructure/docker-compose.yml exec -T celery-worker \
            celery -A core.celery_app inspect ping -t 30

      - name: Assert the frontend serves the SPA
        run: |
          curl -fsS http://localhost:3000 | grep -qi "<!doctype html" \
            && echo "  frontend OK"

      # Only on failure, and this is the whole point: the logs that would
      # otherwise require someone to reproduce it locally.
      - name: Dump logs on failure
        if: failure()
        run: |
          echo "=================== ps ==================="
          docker compose -f infrastructure/docker-compose.yml ps -a
          for svc in api celery-worker postgres redis minio qdrant frontend; do
            echo "=================== $svc ==================="
            docker compose -f infrastructure/docker-compose.yml logs --tail=80 "$svc" || true
          done

      - name: Tear down
        if: always()
        run: docker compose -f infrastructure/docker-compose.yml down -v
