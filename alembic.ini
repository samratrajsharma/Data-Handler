# Alembic configuration for Orchestraty
# https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
# Path to migration environment
script_location = alembic

# Template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# sys.path prepend — so `core.*` imports work inside migrations
prepend_sys_path = .

# Timezone for revision file timestamps (leave empty for localtime)
# timezone =

# Max length of characters to apply to the "slug" field
# truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command,
# regardless of autogenerate.
# revision_environment = false

# Set to 'true' to allow .hierarchyinfo files to be overwritten.
# output_encoding = utf-8

# Connection string — overridden at runtime by env.py from settings,
# but kept here as a fallback / reference.
sqlalchemy.url = postgresql+asyncpg://orchestraty:orchestraty_dev@localhost:5432/orchestraty

[post_write_hooks]
# Uncomment to run black on newly generated migration files:
# hooks = black
# black.type = console_scripts
# black.entrypoint = black

# ── Logging ──────────────────────────────────────────────────────────────

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
