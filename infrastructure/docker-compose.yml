services:
  api:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
    container_name: orchestraty-api
    # Override the Dockerfile CMD to enable --reload so code changes on
    # the host (bind-mounted at /app) are picked up automatically without
    # restarting the container. This eliminates the "did -Refresh work?"
    # confusion entirely for the API.
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    volumes:
      - ..:/app
      - hf_cache:/opt/hf-cache
    environment:
      HF_HOME: /opt/hf-cache
      TRANSFORMERS_CACHE: /opt/hf-cache
      SENTENCE_TRANSFORMERS_HOME: /opt/hf-cache/sentence-transformers
    # Add host.docker.internal so the container can reach services running
    # on the host machine (e.g. Ollama at host.docker.internal:11434).
    # Docker Desktop on Windows/Mac sets this automatically; explicit
    # extra_hosts ensures it works on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - orchestraty-net
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: orchestraty-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: orchestraty
      POSTGRES_PASSWORD: orchestraty_dev
      POSTGRES_DB: orchestraty
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - orchestraty-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestraty -d orchestraty"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: orchestraty-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - orchestraty-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: orchestraty-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - orchestraty-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --- Phase 2: Celery Worker ---
  celery-worker:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
    container_name: orchestraty-celery-worker
    command: celery -A core.celery_app worker --loglevel=info --concurrency=2
    env_file:
      - ../.env
    volumes:
      - ..:/app
      - hf_cache:/opt/hf-cache
    environment:
      HF_HOME: /opt/hf-cache
      TRANSFORMERS_CACHE: /opt/hf-cache
      SENTENCE_TRANSFORMERS_HOME: /opt/hf-cache/sentence-transformers
    # AI labeling tasks run here and need to reach Ollama on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - orchestraty-net
    restart: unless-stopped

  # --- Phase 2: Qdrant Vector Database ---
  qdrant:
    image: qdrant/qdrant:latest
    container_name: orchestraty-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - orchestraty-net
    restart: unless-stopped

  # --- Phase 3: Ollama (Local LLM) — optional, comment out if not needed ---
  ollama:
    image: ollama/ollama:latest
    container_name: orchestraty-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - orchestraty-net
    restart: unless-stopped
    profiles:
      - llm

volumes:
  postgres_data:
  minio_data:
  redis_data:
  qdrant_data:
  ollama_data:
  hf_cache:

networks:
  orchestraty-net:
    driver: bridge
