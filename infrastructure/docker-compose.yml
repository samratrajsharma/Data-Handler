services:
  api:
    # Pull this prebuilt image from GHCR when available (fast install); falls
    # back to building locally from the Dockerfile below if it isn't published.
    image: ghcr.io/samratrajsharma/data-handler-api:latest
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
      target: runtime-ml
    container_name: datahandler-api
    # No command override and no source bind mount here on purpose. The API runs
    # the code baked into the image, so what you pulled is what executes and the
    # image digest actually describes the running code.
    #
    # Live reload for contributors lives in docker-compose.dev.yml
    # (run.ps1 -Dev / run.sh --dev), which adds the bind mount and --reload back.
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ../.env
    volumes:
      - hf_cache:/opt/hf-cache
    environment:
      HF_HOME: /opt/hf-cache
      TRANSFORMERS_CACHE: /opt/hf-cache
      SENTENCE_TRANSFORMERS_HOME: /opt/hf-cache/sentence-transformers
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    # Add host.docker.internal so the container can reach services running
    # on the host machine (e.g. Ollama at host.docker.internal:11434).
    # Docker Desktop on Windows/Mac sets this automatically; explicit
    # extra_hosts ensures it works on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - datahandler-net
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: datahandler-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: datahandler
      POSTGRES_PASSWORD: datahandler_dev
      POSTGRES_DB: datahandler
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - datahandler-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datahandler -d datahandler"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --- Object storage (S3) -------------------------------------------------
  # SeaweedFS, not MinIO.
  #
  # WHY THE SWITCH
  # minio/minio became unpullable from Docker Hub AND quay.io in Sept 2026 —
  # the repository now requires authentication, including by digest. Existing
  # machines kept working from their Docker cache, so the break was invisible
  # until a clean runner tried to install. Every NEW user was already broken.
  #
  # WHY SEAWEEDFS SPECIFICALLY
  #   - Apache-2.0 and freely pullable, with no redistribution question.
  #   - Published multi-arch (amd64 AND arm64), so Apple Silicon works
  #     natively. Mirroring our cached MinIO image could not do this: that
  #     cache holds a single platform, so an M-series Mac would have been
  #     stuck on x86 emulation for a storage service.
  #   - Speaks S3 with SigV4, including presigned GETs, which is the only
  #     part of the API this app truly depends on.
  #
  # NO APPLICATION CODE CHANGED. core/storage.py builds a `minio` Python
  # client, which is a generic S3 client — the library name is a historical
  # accident, not a coupling. Only the endpoint and port move.
  seaweedfs:
    image: ${S3_IMAGE:-chrislusf/seaweedfs:latest}
    container_name: datahandler-s3
    ports:
      - "127.0.0.1:8333:8333"
    # -dir is the data root; the volume below is the SAME one MinIO used, so
    # an existing install keeps its files on disk. They are not readable by
    # SeaweedFS (different on-disk layout), which is why the upgrade note in
    # .env.example tells you to re-upload rather than pretending otherwise.
    command: >
      server -dir=/data -s3 -s3.port=8333
      -s3.config=/etc/seaweedfs/s3.json
      -master.volumeSizeLimitMB=1024
    volumes:
      - minio_data:/data
      - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      # The S3 port answering is what the app needs; the master UI is not
      # enough, because the gateway comes up after the master.
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8333 >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      - datahandler-net
    restart: unless-stopped

  # --- MinIO (legacy, opt-in) ---------------------------------------------
  # Kept behind a profile so anyone who still has a pullable MinIO image — a
  # cached copy, a private mirror — can use it:
  #   docker compose --profile minio up -d
  # and set MINIO_ENDPOINT=minio:9000 / MINIO_PUBLIC_ENDPOINT=localhost:9000.
  # It does NOT start by default; the default install must work for everyone.
  minio:
    profiles: ["minio"]
    image: ${MINIO_IMAGE:-minio/minio:latest}
    container_name: datahandler-minio
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - datahandler-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: datahandler-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - datahandler-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --- Celery worker ---
  celery-worker:
    # Same image as the api service (one backend image, different command).
    image: ghcr.io/samratrajsharma/data-handler-api:latest
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
      target: runtime-ml
    container_name: datahandler-celery-worker
    command: celery -A core.celery_app worker --loglevel=info --concurrency=2
    # The worker shares the api image, which carries an HTTP HEALTHCHECK — but
    # the worker listens on no port, so that check would fail forever and mark
    # the container unhealthy. Disable it here.
    healthcheck:
      disable: true
    env_file:
      - ../.env
    volumes:
      - hf_cache:/opt/hf-cache
    environment:
      HF_HOME: /opt/hf-cache
      TRANSFORMERS_CACHE: /opt/hf-cache
      SENTENCE_TRANSFORMERS_HOME: /opt/hf-cache/sentence-transformers
      # Point at the bundled Ollama when the `llm` profile is active; the
      # launchers export OLLAMA_BASE_URL=http://ollama:11434 in that case.
      # Default stays host.docker.internal for anyone running Ollama on the host.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    # AI labeling tasks run here and need to reach Ollama on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    networks:
      - datahandler-net
    restart: unless-stopped

  # --- Qdrant vector database ---
  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:latest}
    container_name: datahandler-qdrant
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - datahandler-net
    restart: unless-stopped

  # --- Ollama (optional local LLM) ---
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    container_name: datahandler-ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - datahandler-net
    restart: unless-stopped
    profiles:
      - llm

  # --- One-shot: pull the default model into the bundled Ollama ---
  # Without this the `llm` profile starts an Ollama server with NO models, and
  # the first AI-labeling request fails deep inside a background job with an
  # opaque "model not found". Runs once, exits, does not restart.
  #
  # First run downloads several GB of model weights into the ollama_data volume;
  # subsequent runs find the model present and exit immediately.
  ollama-init:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    container_name: datahandler-ollama-init
    depends_on:
      - ollama
    entrypoint:
      - /bin/sh
      - -c
      - >
        sleep 3;
        OLLAMA_HOST=http://ollama:11434 ollama pull "${DEFAULT_LLM_MODEL:-llama3}"
    networks:
      - datahandler-net
    restart: "no"
    profiles:
      - llm

  # --- Frontend: React + Vite built to static files, served by nginx.
  #     nginx also reverse-proxies /api/* to the api service, so the whole
  #     app is reachable from a single origin (http://localhost:3000). ---
  frontend:
    image: ghcr.io/samratrajsharma/data-handler-frontend:latest
    build:
      context: ../frontend/Frontend
      dockerfile: Dockerfile
    container_name: datahandler-frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - api
    networks:
      - datahandler-net
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  redis_data:
  qdrant_data:
  ollama_data:
  hf_cache:

networks:
  datahandler-net:
    driver: bridge
