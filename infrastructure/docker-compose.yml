services:
  api:
    # Pull this prebuilt image from GHCR when available (fast install); falls
    # back to building locally from the Dockerfile below if it isn't published.
    image: ghcr.io/samratrajsharma/data-handler-api:latest
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
    container_name: datahandler-api
    # Override the Dockerfile CMD to enable --reload so code changes on
    # the host (bind-mounted at /app) are picked up automatically without
    # restarting the container. This eliminates the "did -Refresh work?"
    # confusion entirely for the API.
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    volumes:
      - ..:/app
      - hf_cache:/opt/hf-cache
    environment:
      HF_HOME: /opt/hf-cache
      TRANSFORMERS_CACHE: /opt/hf-cache
      SENTENCE_TRANSFORMERS_HOME: /opt/hf-cache/sentence-transformers
    # Add host.docker.internal so the container can reach services running
    # on the host machine (e.g. Ollama at host.docker.internal:11434).
    # Docker Desktop on Windows/Mac sets this automatically; explicit
    # extra_hosts ensures it works on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - datahandler-net
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: datahandler-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: datahandler
      POSTGRES_PASSWORD: datahandler_dev
      POSTGRES_DB: datahandler
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - datahandler-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datahandler -d datahandler"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: datahandler-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - datahandler-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: datahandler-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - datahandler-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --- Celery worker ---
  celery-worker:
    # Same image as the api service (one backend image, different command).
    image: ghcr.io/samratrajsharma/data-handler-api:latest
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
    container_name: datahandler-celery-worker
    command: celery -A core.celery_app worker --loglevel=info --concurrency=2
    env_file:
      - ../.env
    volumes:
      - ..:/app
      - hf_cache:/opt/hf-cache
    environment:
      HF_HOME: /opt/hf-cache
      TRANSFORMERS_CACHE: /opt/hf-cache
      SENTENCE_TRANSFORMERS_HOME: /opt/hf-cache/sentence-transformers
    # AI labeling tasks run here and need to reach Ollama on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - datahandler-net
    restart: unless-stopped

  # --- Qdrant vector database ---
  qdrant:
    image: qdrant/qdrant:latest
    container_name: datahandler-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - datahandler-net
    restart: unless-stopped

  # --- Ollama (optional local LLM) ---
  ollama:
    image: ollama/ollama:latest
    container_name: datahandler-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - datahandler-net
    restart: unless-stopped
    profiles:
      - llm

  # --- Frontend: React + Vite built to static files, served by nginx.
  #     nginx also reverse-proxies /api/* to the api service, so the whole
  #     app is reachable from a single origin (http://localhost:3000). ---
  frontend:
    image: ghcr.io/samratrajsharma/data-handler-frontend:latest
    build:
      context: ../frontend/Frontend
      dockerfile: Dockerfile
    container_name: datahandler-frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - datahandler-net
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  redis_data:
  qdrant_data:
  ollama_data:
  hf_cache:

networks:
  datahandler-net:
    driver: bridge
